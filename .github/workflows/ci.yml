name: CI

on:
  # Images are published only on a push to main (publish-main below).
  # Pull requests run the same checks for every base branch, including a
  # PR stacked on another PR. They never push an image.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: |
          go vet ./...
          # The real-tailnet e2e tests only build with -tags e2e; keep them compiling.
          go vet -tags e2e ./test/...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: Test with coverage ratchet
        run: ./scripts/coverage.sh

      - name: Build
        run: |
          CGO_ENABLED=0 go build -ldflags "-s -w -X main.Version=ci" -o tailnetlink ./cmd/tailnetlink
          test "$(./tailnetlink -version)" = "ci"

      - name: GoReleaser check
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

  # Builds the image on PRs and main to catch Dockerfile breakage, but never
  # pushes it. Images are published only by release.yml, on version tags.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          # The action pulls moby/buildkit before the Dockerfile runs.
          # Docker Hub times that pull out. The mirror serves the same tag.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Pause before a Buildx retry
        if: steps.buildx.outcome == 'failure'
        run: sleep 20

      - name: Retry Buildx setup
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          name: buildx-retry
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Build (no push)
        id: build
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: tailnetlink:ci
          build-args: |
            VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Docker Hub answers 429 on the base-image manifest often enough to
      # fail an otherwise green pull request. One pause and a second build
      # is enough when the first request was rate limited.
      - name: Pause before an image retry
        if: steps.build.outcome == 'failure'
        run: sleep 45

      - name: Retry the image build
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: tailnetlink:ci
          build-args: |
            VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Smoke the image
        run: |
          set -euo pipefail
          test "$(docker run --rm tailnetlink:ci -version)" = "ci"
          test "$(docker run --rm --entrypoint id tailnetlink:ci -u)" = "65532"
          mkdir -p /tmp/tnl-smoke
          cat >/tmp/tnl-smoke/tailnetlink.json <<'JSON'
          {"name":"smoke","ui":{"enabled":false},"metrics_addr":":9090","tailnets":{"a":{"tailnet":"a.ts.net","auth":{"client_id":"x","client_secret_env":"A"}},"b":{"tailnet":"b.ts.net","auth":{"client_id":"y","client_secret_env":"B"}}},"targets":{"web":{"in":"a","tag":"tag:web","ports":[80]}},"exports":[{"target":"web","to":["b"]}]}
          JSON
          # Strip the leading spaces YAML left on the heredoc body.
          sed -i 's/^[[:space:]]*//' /tmp/tnl-smoke/tailnetlink.json
          cid=$(docker run -d --rm -e A=a -e B=b             -v /tmp/tnl-smoke/tailnetlink.json:/data/tailnetlink.json:ro             -p 127.0.0.1:19090:9090 tailnetlink:ci)
          trap 'docker stop "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:19090/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$cid" || true
          exit 1

      - name: Multi-arch build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  publish-main:
    # Main builds are published so deployments can pin one by digest.
    # Version tags are still handled by release.yml.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Pause before a Buildx retry
        if: steps.buildx.outcome == 'failure'
        run: sleep 20

      - name: Retry Buildx setup
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          name: buildx-retry
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:sha-${{ steps.sha.outputs.short }}
          build-args: |
            VERSION=main-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pause before an image retry
        if: steps.push.outcome == 'failure'
        run: sleep 45

      - name: Retry the image push
        id: push_retry
        if: steps.push.outcome == 'failure'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:sha-${{ steps.sha.outputs.short }}
          build-args: |
            VERSION=main-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Digest
        run: |
          digest="${{ steps.push.outputs.digest }}"
          if [ -z "$digest" ]; then
            digest="${{ steps.push_retry.outputs.digest }}"
          fi
          echo "pushed ghcr.io/${{ github.repository }}@${digest}" >> "$GITHUB_STEP_SUMMARY"
